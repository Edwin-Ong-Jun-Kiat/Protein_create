<svg xmlns="http://www.w3.org/2000/svg" style="color:#161923" viewBox="0 0 1000 342" role="img" aria-label="Two pipeline traces. The JSON encoding bug stops the run at the prepare stage before any GPU time. The ProteinMPNN chain assignment bug, if repaired naively, passes through every remaining stage and produces a normal-looking submission file built on a corrupted target."><rect x="0" y="0" width="1000" height="342" fill="#ffffff"/>
        <defs>
          <marker id="ar4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        </defs>

        <text x="20" y="26" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity=".6" letter-spacing="1">A · LOUD FAILURE — int64 into json.dumps()</text>
        <g>
          <rect x="55" y="42" width="110" height="42" rx="3" fill="none" stroke="#b8432c" stroke-width="2"/>
          <rect x="183" y="42" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 3"/>
          <rect x="311" y="42" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 3"/>
          <rect x="439" y="42" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 3"/>
          <rect x="567" y="42" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 3"/>
          <rect x="695" y="42" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="3 3"/>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="11.5" text-anchor="middle">
          <text x="110" y="68" fill="#b8432c" font-weight="500">prepare</text>
          <text x="238" y="68" fill="currentColor" opacity=".25">diffuse</text>
          <text x="366" y="68" fill="currentColor" opacity=".25">mpnn</text>
          <text x="494" y="68" fill="currentColor" opacity=".25">fold</text>
          <text x="622" y="68" fill="currentColor" opacity=".25">score</text>
          <text x="750" y="68" fill="currentColor" opacity=".25">submit</text>
        </g>
        <g stroke="#b8432c" stroke-width="2">
          <line x1="160" y1="96" x2="180" y2="116"/><line x1="180" y1="96" x2="160" y2="116"/>
        </g>
        <text x="196" y="112" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#b8432c" font-weight="600">stops here, 15 s in — zero GPU hours burned</text>

        <line x1="20" y1="146" x2="980" y2="146" stroke="currentColor" stroke-opacity=".2"/>

        <text x="20" y="178" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity=".6" letter-spacing="1">B · SILENT FAILURE — --chain_list "C A B", the tempting repair</text>
        <text x="366" y="204" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="#8a6412" text-anchor="middle" font-weight="600">target silently redesigned here</text>
        <g>
          <rect x="55" y="214" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="183" y="214" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="311" y="214" width="110" height="42" rx="3" fill="none" stroke="#8a6412" stroke-width="2"/>
          <rect x="439" y="214" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="567" y="214" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="695" y="214" width="110" height="42" rx="3" fill="none" stroke="currentColor" stroke-opacity=".45"/>
          <rect x="845" y="214" width="135" height="42" rx="3" fill="none" stroke="#8a6412" stroke-width="2" stroke-dasharray="4 3"/>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="11.5" text-anchor="middle" fill="currentColor">
          <text x="110" y="240">prepare</text>
          <text x="238" y="240">diffuse</text>
          <text x="366" y="240" fill="#8a6412" font-weight="500">mpnn</text>
          <text x="494" y="240">fold</text>
          <text x="622" y="240">score</text>
          <text x="750" y="240">submit</text>
          <text x="912" y="240" fill="#8a6412" font-weight="500">submission.csv</text>
        </g>
        <line x1="808" y1="235" x2="838" y2="235" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar4)"/>
        <text x="20" y="286" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="currentColor" opacity=".75">Exit code 0 at every stage. Well-formed FASTA. Plausible pLDDT. Every downstream metric computed against a TNF-α that no longer exists.</text>
        <text x="20" y="310" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#8a6412" font-weight="600">The fix is an assertion, not a test: read back which chains the tool actually chose, and refuse to continue unless it is the binder alone.</text>
        <text x="20" y="332" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity=".55">mpnn: designing ['C'], holding ['A', 'B'] fixed</text>
      </svg>