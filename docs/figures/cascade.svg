<svg xmlns="http://www.w3.org/2000/svg" style="color:#161923" viewBox="0 0 1000 292" role="img" aria-label="Five-stage cascade: prepare, RFdiffusion, ProteinMPNN, ESMFold, and score and select, with each stage's machine learning role, compute cost, and the artifact passed to the next stage."><rect x="0" y="0" width="1000" height="292" fill="#ffffff"/>
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        </defs>
        <g font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity=".55" letter-spacing="1">
          <text x="20" y="22">CONDITION</text>
          <text x="225" y="22">GENERATE</text>
          <text x="430" y="22">DECODE</text>
          <text x="635" y="22">VERIFY</text>
          <text x="840" y="22">SELECT</text>
        </g>

        <g>
          <rect x="20" y="36" width="145" height="96" rx="3" fill="none" stroke="currentColor" stroke-opacity=".3"/>
          <rect x="225" y="36" width="145" height="96" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="430" y="36" width="145" height="96" rx="3" fill="none" stroke="currentColor" stroke-opacity=".3"/>
          <rect x="635" y="36" width="145" height="96" rx="3" fill="none" stroke="currentColor" stroke-opacity=".3"/>
          <rect x="840" y="36" width="145" height="96" rx="3" fill="none" stroke="currentColor" stroke-opacity=".3"/>
        </g>

        <g font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="600" fill="currentColor" text-anchor="middle">
          <text x="92" y="64">epitope scan</text>
          <text x="297" y="64">RFdiffusion</text>
          <text x="502" y="64">ProteinMPNN</text>
          <text x="707" y="64">ESMFold</text>
          <text x="912" y="64">score + gate</text>
        </g>
        <g font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="currentColor" opacity=".65" text-anchor="middle">
          <text x="92" y="86">feature selection:</text><text x="92" y="100">where to condition</text>
          <text x="297" y="86">conditional diffusion</text><text x="297" y="100">model over SE(3)</text>
          <text x="502" y="86">inverse folding;</text><text x="502" y="100">p(seq | structure)</text>
          <text x="707" y="86">forward model;</text><text x="707" y="100">p(structure | seq)</text>
          <text x="912" y="86">hand-written reward</text><text x="912" y="100">+ rejection sampling</text>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle">
          <text x="92" y="122" fill="currentColor" opacity=".45">CPU · 15 s</text>
          <text x="297" y="122" fill="currentColor" opacity=".9" font-weight="500">GPU · 10–12 h</text>
          <text x="502" y="122" fill="currentColor" opacity=".45">GPU · 15 min</text>
          <text x="707" y="122" fill="currentColor" opacity=".45">GPU · 45 min</text>
          <text x="912" y="122" fill="currentColor" opacity=".45">CPU · 5 min</text>
        </g>

        <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)" color="currentColor">
          <line x1="167" y1="84" x2="218" y2="84"/>
          <line x1="372" y1="84" x2="423" y2="84"/>
          <line x1="577" y1="84" x2="628" y2="84"/>
          <line x1="782" y1="84" x2="833" y2="84"/>
        </g>
        <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".6" text-anchor="middle">
          <text x="192" y="160">hotspots</text>
          <text x="397" y="160">backbones</text>
          <text x="602" y="160">sequences</text>
          <text x="807" y="160">pLDDT, RMSD</text>
        </g>
        <g stroke="currentColor" stroke-opacity=".3" stroke-dasharray="2 3">
          <line x1="192" y1="92" x2="192" y2="148"/>
          <line x1="397" y1="92" x2="397" y2="148"/>
          <line x1="602" y1="92" x2="602" y2="148"/>
          <line x1="807" y1="92" x2="807" y2="148"/>
        </g>

        <line x1="20" y1="196" x2="985" y2="196" stroke="currentColor" stroke-opacity=".25"/>
        <text x="20" y="220" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".55" letter-spacing="1">NO GRADIENT PATH</text>
        <path d="M 912 232 C 912 252, 297 252, 297 140" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
        <text x="604" y="278" font-family="IBM Plex Sans, sans-serif" font-size="12" fill="currentColor" opacity=".6" text-anchor="middle">the objective never reaches the generator — it only rejects its samples</text>
      </svg>